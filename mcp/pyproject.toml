[project]
name = "cc-uv-mcp"
version = "0.1.0"
description = "MCP server for uv Python package manager integration with Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "certifi>=2026.10.19",
]

[project.scripts]
cc-uv-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
